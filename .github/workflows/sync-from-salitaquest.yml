name: One-shot sync from SalitaQuest

on:
  push:
    branches:
      - consolidation/phase-4-cleanroom
    paths:
      - .github/workflows/sync-from-salitaquest.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TestSalita cleanroom branch
        uses: actions/checkout@v4
        with:
          ref: consolidation/phase-4-cleanroom
          fetch-depth: 0

      - name: Check out current SalitaQuest
        uses: actions/checkout@v4
        with:
          repository: Costieman/SalitaQuest
          ref: main
          path: source-salitaquest

      - name: Replace application contents with SalitaQuest snapshot
        shell: bash
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            --exclude 'source-salitaquest/' \
            source-salitaquest/ ./
          rm -rf source-salitaquest

      - name: Commit synchronized baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Application files already match SalitaQuest.'
            exit 0
          fi
          git commit -m 'Sync cleanroom application baseline from SalitaQuest main'
          git push origin HEAD:consolidation/phase-4-cleanroom
