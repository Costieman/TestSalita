<body>
  <main class="loader" id="loader">
    <div class="mark">S★</div>
    <h1>Opening your Tagalog journey…</h1>

  </main>
  <script>
    (async () => {
      "use strict";
      const SOURCE = "https://raw.githubusercontent.com/Costieman/SalitaQuest/cb89fa4778737b16408bd5a66dd8fcc7f7f37f81/index.html";
      const DOCUMENT_CACHE = "salitaQuestAppDocumentV554";
      const PROFILE_STORE = "salitaQuestLocalProfilesV1";
      const ACTIVE_PROFILE = "salitaQuestActiveProfileId";
      const ACTIVE_COURSE = "salitaQuestActiveCourse";
      const COURSE_ID = "tagalog";
      const BASE_PROGRESS = "salitaQuestProgress";
      const BASE_OWNER = "salitaQuestBaseProgressOwner";
      const PROFILE_PROGRESS_PREFIX = "salitaQuestProgress.profile.";
      function readProfiles(){try{const store=JSON.parse(localStorage.getItem(PROFILE_STORE)||"null");return store&&Array.isArray(store.profiles)?store.profiles:[];}catch{return[];}}
      function saveSharedProgress(owner,progress){if(!owner||!progress)return;const separator=owner.lastIndexOf(":");const profileId=separator>0?owner.slice(0,separator):owner;const courseId=separator>0?owner.slice(separator+1):"tagalog";if(!readProfiles().some(item=>item.id===profileId))return;localStorage.setItem(`${PROFILE_PROGRESS_PREFIX}${profileId}.${courseId}`,progress);if(courseId==="tagalog")localStorage.setItem(`${PROFILE_PROGRESS_PREFIX}${profileId}`,progress);}
      const activeId=sessionStorage.getItem(ACTIVE_PROFILE);const profile=readProfiles().find(item=>item.id===activeId);if(!activeId||!profile){window.location.replace("./");return;}
      const previousOwner=localStorage.getItem(BASE_OWNER);const sharedProgress=localStorage.getItem(BASE_PROGRESS);saveSharedProgress(previousOwner,sharedProgress);
      const courseProgressKey=`${PROFILE_PROGRESS_PREFIX}${activeId}.${COURSE_ID}`;const legacyProgressKey=`${PROFILE_PROGRESS_PREFIX}${activeId}`;const activeProgress=localStorage.getItem(courseProgressKey)||localStorage.getItem(legacyProgressKey);if(activeProgress){localStorage.setItem(BASE_PROGRESS,activeProgress);localStorage.setItem(courseProgressKey,activeProgress);}else localStorage.removeItem(BASE_PROGRESS);localStorage.setItem(BASE_OWNER,`${activeId}:${COURSE_ID}`);sessionStorage.setItem(ACTIVE_COURSE,COURSE_ID);
      let html="";try{const response=await fetch(SOURCE,{cache:"force-cache"});if(!response.ok)throw new Error(`Course document unavailable (${response.status})`);html=await response.text();if(!html.includes('id="homeView"')||!html.includes('src="app.js"'))throw new Error("The retrieved course document was not recognised.");try{localStorage.setItem(DOCUMENT_CACHE,html);}catch{}}catch(error){try{html=localStorage.getItem(DOCUMENT_CACHE)||"";}catch{}if(!html){console.error(error);document.getElementById("loader").innerHTML='<div class="mark">S★</div><h1>Course files could not be loaded</h1><p class="error">Check your connection, then reload this page. Your learner profile and saved progress remain on this device.</p>';return;}}
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="./"><link rel="stylesheet" href="ui-quality-fixes.css?v=5.4.21"><link rel="stylesheet" href="ui-answer-breakdown.css?v=5.4.21"><link rel="stylesheet" href="incorrect-order-feedback.css?v=5.4.21"><link rel="stylesheet" href="compact-desktop-layout.css?v=5.4.21"><link rel="stylesheet" href="compact-home-dashboard.css?v=5.4.21"><link rel="stylesheet" href="weekly-avatar-chest.css?v=5.4.21"><link rel="stylesheet" href="clean-topbar.css?v=5.4.21"><link rel="stylesheet" href="world-progress-status.css?v=5.4.21"><link rel="stylesheet" href="mastery-feedback.css?v=5.4.21"><link rel="stylesheet" href="mastery-console-overrides.css?v=5.4.21"><link rel="stylesheet" href="lesson-side-launcher.css?v=5.4.21"><link rel="stylesheet" href="mobile-session-refinement.css?v=5.4.21"><link rel="stylesheet" href="profile-emblem-control.css?v=5.5.4"><link rel="stylesheet" href="level-progression-v2.css?v=5.5.3"><link rel="stylesheet" href="fluid-desktop-app.css?v=5.4.21"><link rel="stylesheet" href="adaptive-scenarios.css?v=5.4.21"><link rel="stylesheet" href="desktop-navigation-refinement.css?v=5.5.3"><link rel="stylesheet" href="badge-catalogue-v2.css?v=5.4.23"><link rel="stylesheet" href="badge-layout-v3.css?v=5.4.25"><link rel="stylesheet" href="badge-chest-v2.css?v=5.4.29"><link rel="stylesheet" href="placement-onboarding-v1.css?v=5.4.23"><link rel="stylesheet" href="social-connections-v2.css?v=5.4.27"><link rel="stylesheet" href="achievement-sharing-v4.css?v=5.4.29"><style>@media(min-width:900px){.avatar-collection-modal,.sq-desktop-collection-safe,[data-avatar-collection-modal]{max-height:calc(100dvh - 32px)!important;overflow:hidden!important}.avatar-collection-modal .modal-content,.sq-desktop-collection-safe .modal-content,.avatar-collection-modal [role=tabpanel],.sq-desktop-collection-safe [role=tabpanel]{max-height:calc(100dvh - 190px)!important;overflow-y:auto!important;overscroll-behavior:contain}.avatar-case-slot img,.avatar-card img,.sq-desktop-collection-safe img{object-fit:contain!important;object-position:center!important;max-width:100%!important;max-height:100%!important}}</style>');
      html=html.replace(/<body([^>]*)>/i,'<body$1 data-course="tagalog">');
      html=html.replace(/<\/body>/i,'<script src="progression-v54.js?v=5.4.21"><\/script><script src="exercise-fixes-v545.js?v=5.4.21"><\/script><script src="ui-quality-fixes.js?v=5.4.21"><\/script><script src="daily-goal-refinement.js?v=5.4.21"><\/script><script src="weekly-avatar-chest.js?v=5.4.21"><\/script><script src="key-run-refinement.js?v=5.4.21"><\/script><script src="weekly-avatar-polish.js?v=5.4.21"><\/script><script src="incorrect-order-feedback.js?v=5.4.21"><\/script><script src="compact-desktop-layout.js?v=5.4.21"><\/script><script src="clean-topbar.js?v=5.4.21"><\/script><script src="even-progress-rail.js?v=5.4.21"><\/script><script src="translation-gloss-completion-v1.js?v=2.0.0"><\/script><script src="mastery-feedback.js?v=5.4.21"><\/script><script src="lesson-side-launcher.js?v=5.4.21"><\/script><script src="mobile-session-refinement.js?v=5.4.21"><\/script><script src="popup-governor-v1.js?v=5.5.3"><\/script><script src="profile-app.js?v=5.5.4"><\/script><script src="profile-emblem-control.js?v=5.5.4"><\/script><script src="adaptive-scenarios.js?v=5.4.21"><\/script><script src="level-progression-v2.js?v=5.5.3"><\/script><script src="level-up-mobile-safety-v552.js?v=5.5.3"><\/script><script src="desktop-navigation-refinement.js?v=5.5.3"><\/script><script src="pronunciation-release-control.js?v=5.4.22"><\/script><script src="home-reward-coordinator.js?v=5.4.22"><\/script><script src="daily-key-reward-priority-v1.js?v=1.0.0"><\/script><script src="badge-catalogue-v2.js?v=5.4.23"><\/script><script src="badge-chest-v2.js?v=5.4.29"><\/script><script src="placement-onboarding-v1.js?v=5.4.23"><\/script><script src="social-connections-v2.js?v=5.4.27"><\/script><script src="achievement-sharing-v4.js?v=5.4.29"><\/script><script src="collection-key-translation-hotfix.js?v=5.5.11"><\/script></body>');
