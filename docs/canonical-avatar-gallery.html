<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salita Quest — Canonical Avatar Gallery</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--surface:light-dark(#fff,#162033);--page:light-dark(#f3f6fb,#0b1120);--text:light-dark(#172033,#edf3ff);--muted:light-dark(#5d687b,#aebbd0);--border:light-dark(#dfe5ef,#2b3850);--success:light-dark(#176b3a,#7ee2a8);--danger:light-dark(#a52a2a,#ff9c9c)}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text)}main{width:min(1200px,calc(100% - 32px));margin:auto;padding:32px 0 48px}header{display:grid;gap:8px;margin-bottom:24px}h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem)}p{margin:0;color:var(--muted)}.summary{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:20px 0 24px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);font-weight:650}.summary[data-state="pass"]{color:var(--success)}.summary[data-state="fail"]{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:0 8px 22px rgb(0 0 0/.06)}.art{aspect-ratio:1;display:grid;place-items:center;padding:12px;background-image:linear-gradient(45deg,rgb(127 127 127/.08) 25%,transparent 25%),linear-gradient(-45deg,rgb(127 127 127/.08) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgb(127 127 127/.08) 75%),linear-gradient(-45deg,transparent 75%,rgb(127 127 127/.08) 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}img{width:100%;height:100%;object-fit:contain;display:block}.meta{padding:12px 14px 14px;border-top:1px solid var(--border)}.name{margin:0 0 5px;font-size:.98rem}.id{margin:0;color:var(--muted);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.badge{display:inline-block;margin-top:8px;padding:3px 8px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.card[data-load="error"]{border-color:var(--danger)}.errors{white-space:pre-wrap;color:var(--danger);margin-top:18px}
  </style>
</head>
<body data-gallery-status="loading">
  <main>
    <header>
      <h1>Canonical Avatar Gallery</h1>
      <p>Generated at runtime from <code>avatars/canonical/manifest.json</code>. Every card uses one direct canonical PNG path.</p>
    </header>
    <section id="summary" class="summary" data-state="loading" aria-live="polite">
      <span id="status-text">Loading manifest and artwork…</span>
      <span>Expected: <strong>48</strong></span>
      <span>Loaded: <strong id="loaded-count">0</strong></span>
      <span>Failed: <strong id="failed-count">0</strong></span>
    </section>
    <section id="gallery" class="grid" aria-label="Canonical avatars"></section>
    <pre id="errors" class="errors" hidden></pre>
  </main>
  <script type="module">
    const EXPECTED_COUNT=48;
    const manifestUrl=new URL('../avatars/canonical/manifest.json',window.location.href);
    const gallery=document.querySelector('#gallery');
    const summary=document.querySelector('#summary');
    const statusText=document.querySelector('#status-text');
    const loadedCount=document.querySelector('#loaded-count');
    const failedCount=document.querySelector('#failed-count');
    const errorsBox=document.querySelector('#errors');

    function loadImage(url,alt){
      return new Promise(resolve=>{
        const image=new Image();
        image.alt=alt;
        image.decoding='async';
        image.addEventListener('load',()=>resolve({ok:true,image}),{once:true});
        image.addEventListener('error',()=>resolve({ok:false,error:`Failed to load ${url}`}),{once:true});
        image.src=url;
      });
    }

    function makeCard(avatar){
      const card=document.createElement('article');
      card.className='card';
      card.dataset.avatarId=avatar.id;
      card.dataset.canonicalPath=avatar.canonicalPath;
      const art=document.createElement('div');
      art.className='art';
      const meta=document.createElement('div');
      meta.className='meta';
      const name=document.createElement('h2');
      name.className='name';
      name.textContent=`${avatar.order+1}. ${avatar.name}`;
      const id=document.createElement('p');
      id.className='id';
      id.textContent=avatar.id;
      const badge=document.createElement('span');
      badge.className='badge';
      badge.textContent=avatar.rarity;
      meta.append(name,id,badge);
      card.append(art,meta);
      gallery.append(card);
      return {card,art};
    }

    try{
      const response=await fetch(manifestUrl,{cache:'no-store'});
      if(!response.ok)throw new Error(`Manifest request failed with HTTP ${response.status}`);
      const manifest=await response.json();
      const avatars=Array.isArray(manifest.avatars)?[...manifest.avatars].sort((a,b)=>a.order-b.order):[];
      if(avatars.length!==EXPECTED_COUNT)throw new Error(`Manifest contains ${avatars.length} avatars; expected ${EXPECTED_COUNT}`);
      const paths=avatars.map(item=>item.canonicalPath);
      if(new Set(paths).size!==EXPECTED_COUNT)throw new Error('Canonical image paths are not unique.');

      const cards=avatars.map(avatar=>{
        if(!avatar.canonicalPath?.startsWith('avatars/canonical/')||!avatar.canonicalPath.endsWith('.png'))throw new Error(`Invalid canonical path for ${avatar.id}: ${avatar.canonicalPath}`);
        const imageUrl=new URL(`../${avatar.canonicalPath}`,window.location.href).href;
        return {avatar,imageUrl,...makeCard(avatar)};
      });

      const results=await Promise.all(cards.map(({avatar,imageUrl})=>loadImage(imageUrl,avatar.name)));
      let loaded=0;
      const failures=[];
      results.forEach((result,index)=>{
        const {card,art,avatar,imageUrl}=cards[index];
        if(result.ok){loaded+=1;card.dataset.load='ok';art.append(result.image)}
        else{card.dataset.load='error';failures.push(`${avatar.id}: ${imageUrl}`)}
      });

      loadedCount.textContent=String(loaded);
      failedCount.textContent=String(failures.length);
      const passed=loaded===EXPECTED_COUNT&&failures.length===0;
      document.body.dataset.galleryStatus=passed?'pass':'fail';
      summary.dataset.state=passed?'pass':'fail';
      statusText.textContent=passed?`PASS — all ${EXPECTED_COUNT} canonical avatars loaded independently.`:`FAIL — ${failures.length} image load failure(s).`;
      if(failures.length){errorsBox.hidden=false;errorsBox.textContent=failures.join('\n')}
    }catch(error){
      document.body.dataset.galleryStatus='fail';
      summary.dataset.state='fail';
      statusText.textContent='FAIL — gallery validation could not complete.';
      failedCount.textContent='1';
      errorsBox.hidden=false;
      errorsBox.textContent=error instanceof Error?(error.stack??error.message):String(error);
    }
  </script>
</body>
</html>
